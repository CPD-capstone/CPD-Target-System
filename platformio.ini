[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
; AI-modified (Claude): moved from esp32dev (DevKitC-32E) to the ESP32-S3.
; Board: Hosyond ESP32-S3 dev board (DevKitC-1 layout, 44-pin) with an ESP32-S3-WROOM-1
; N16R8 module = 16 MB quad flash + 8 MB octal PSRAM. Flash/monitor through the USB-C port
; labeled COM/UART (the USB-to-serial chip), not the one labeled USB (native USB).
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi ; quad flash + octal PSRAM (required for R8 modules)
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.0 ; For structured data exchange
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    ESP32Async/AsyncTCP @ 3.4.10
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    adafruit/Adafruit BusIO @ ^1.16.1
    SPI ; SPI is built into the ESP32 core, but explicitly referencing it ensures clean builds