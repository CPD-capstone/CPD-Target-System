[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev ; Espressif ESP32-DevKitC-32E (38-pin, ESP32-WROOM-32E)
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.0 ; For structured data exchange
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    ESP32Async/AsyncTCP @ 3.4.10
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    adafruit/Adafruit BusIO @ ^1.16.1
    SPI ; SPI is built into the ESP32 core, but explicitly referencing it ensures clean builds