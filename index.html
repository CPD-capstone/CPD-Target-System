<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page--Connor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <!--Header area with text (moved above sidebar) -->
    <div class="p-3 text-white bg-primary text-center border-start border-5 border-secondary rounded-3 m-3">
        Pistol Drill In Progress...
    </div>

    <!-- Menu Buttons -->
    <div class="m-3">
        <button class="btn btn-outline-primary me-2">Drill</button>
        <button class="btn btn-outline-primary me-2">Score</button>
        <button class="btn btn-outline-primary">Login</button>
    </div>

    <!-- Ticket/Drill In Progress Section -->
    <div class="m-3">
        <div class="card border-start border-5 border-primary" style="width: 300px; height: 300px;">
            <div class="card-header bg-light">
                <div class="d-flex align-items-center justify-content-between">
                    <h5 class="card-title mb-0">Drill ID</h5>
                    <span class="badge bg-warning text-dark">In Progress</span>
                </div>
            </div>
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center">
                <div class="mb-3">
                    <i class="bi bi-bullseye" style="font-size: 2rem; color: #dc3545;"></i>
                    <i class="bi bi-person" style="font-size: 2rem; color: #0d6efd; margin-left: -0.5rem;"></i>
                </div>
                <small class="text-muted">Moving Target</small>
                <small class="text-muted">#0001</small>
            </div>
        </div>
    </div>

    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>

</body>
</html>
