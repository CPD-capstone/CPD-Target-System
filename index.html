<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page--Connor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <!--Header area with text (moved above sidebar) -->
    <div class="p-3 text-white bg-primary text-center border-start border-5 border-secondary rounded-3 m-3">
        Pistol Drill In Progress...
    </div>

    <!-- Menu Button -->
    <div class="m-3">
        <button class="btn btn-outline-primary d-flex flex-column gap-1 p-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPanel" aria-controls="menuPanel" aria-label="Open menu">
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
        </button>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="menuPanel" aria-labelledby="menuPanelLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuPanelLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close menu"></button>
        </div>
        <div class="offcanvas-body">
            <div class="d-grid gap-2">
                <button class="btn btn-outline-primary text-start">Drill</button>
                <button class="btn btn-outline-primary text-start">Login</button>
                <button class="btn btn-outline-primary text-start">Score</button>
            </div>
        </div>
    </div>

    <!-- Ticket/Drill In Progress Section -->
    <div class="m-3">
        <div class="card border-start border-5 border-primary" style="width: 300px; height: 300px;">
            <div class="card-header bg-light">
                <div class="d-flex align-items-center justify-content-between">
                    <h5 class="card-title mb-0">Drill ID</h5>
                    <span class="badge bg-warning text-dark">In Progress</span>
                </div>
            </div>
            <div class="card-body d-flex flex-column align-items-center justify-content-center text-center">
                <div class="mb-3">
                    <i class="bi bi-bullseye" style="font-size: 2rem; color: #dc3545;"></i>
                    <i class="bi bi-person" style="font-size: 2rem; color: #0d6efd; margin-left: -0.5rem;"></i>
                </div>
                <small class="text-muted">Moving Target</small>
                <small class="text-muted">#0001</small>
            </div>
        </div>
    </div>

    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
