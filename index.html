<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page--Connor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Header area with text (moved above sidebar) -->
    <div id="drillStatus" class="p-3 text-white bg-primary text-center border-start border-5 border-secondary rounded-3 m-3" style="--bs-primary-rgb: 0, 87, 184;">
        There are no active drills
    </div>

    <!-- Menu Button -->
    <div class="m-3">
        <button class="btn btn-outline-primary d-flex flex-column gap-1 p-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPanel" aria-controls="menuPanel" aria-label="Open menu">
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
        </button>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="menuPanel" aria-labelledby="menuPanelLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuPanelLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close menu"></button>
        </div>
        <div class="offcanvas-body">
            <div class="d-grid gap-2">
                <button class="btn btn-outline-primary text-start">Drill</button>
                <button class="btn btn-outline-primary text-start">Login</button>
                <button class="btn btn-outline-primary text-start">Score</button>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-3">
        <div class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3 row-gap-5">
            <div class="col d-flex justify-content-center">
                <button class="target-card" type="button" aria-pressed="false" aria-label="Mark target red">
                    <img src="uspsa-target.svg" width="150" height="180" alt="USPSA target">
                </button>
            </div>
            <div class="col d-flex justify-content-center">
                <button class="target-card" type="button" aria-pressed="false" aria-label="Mark target red">
                    <img src="uspsa-target.svg" width="150" height="180" alt="USPSA target">
                </button>
            </div>
            <div class="col d-flex justify-content-center">
                <button class="target-card" type="button" aria-pressed="false" aria-label="Mark target red">
                    <img src="uspsa-target.svg" width="150" height="180" alt="USPSA target">
                </button>
            </div>
            <div class="col d-flex justify-content-center">
                <button class="target-card" type="button" aria-pressed="false" aria-label="Mark target red">
                    <img src="uspsa-target.svg" width="150" height="180" alt="USPSA target">
                </button>
            </div>
            <div class="col d-flex justify-content-center">
                <button class="target-card" type="button" aria-pressed="false" aria-label="Mark target red">
                    <img src="uspsa-target.svg" width="150" height="180" alt="USPSA target">
                </button>
            </div>
        </div>
    </div>

    <footer class="page-readout d-flex flex-column align-items-center" aria-label="Page indicator">
        <strong>&lt;&lt; PG 1 &gt;&gt;</strong>
        <span>5 / 24</span>
    </footer>

    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const drillStatus = document.getElementById('drillStatus');
        const targetCards = document.querySelectorAll('.target-card');

        const updateDrillStatus = () => {
            const hasRedTarget = document.querySelector('.target-card.is-red');
            drillStatus.classList.toggle('bg-danger', hasRedTarget !== null);
            drillStatus.classList.toggle('bg-primary', hasRedTarget === null);
            drillStatus.textContent = hasRedTarget !== null
                ? 'Pistol Drill in Progress'
                : 'There are no active drills';
        };

        targetCards.forEach((targetCard) => {
            targetCard.addEventListener('click', () => {
                const isRed = targetCard.classList.toggle('is-red');
                targetCard.setAttribute('aria-pressed', isRed);
                targetCard.setAttribute('aria-label', isRed ? 'Return target to green' : 'Mark target red');
                updateDrillStatus();
            });
        });
    </script>

</body>
</html>
