<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPD Target System | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-page">
        <div class="modal d-block position-static" tabindex="-1" aria-labelledby="loginModalTitle" aria-modal="true" role="dialog">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content login-modal">
                    <div class="modal-header">
                        <h1 class="modal-title fs-4" id="loginModalTitle">Sign in</h1>
                    </div>
                    <form id="loginForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input class="form-control" id="username" name="username" type="text" autocomplete="username" required autofocus>
                            </div>
                            <div>
                                <label class="form-label" for="password">Password</label>
                                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                            </div>
                            <div class="alert alert-danger mt-3 mb-0" id="loginError" hidden role="alert">
                                Invalid username or password.
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-primary w-100" type="submit">Sign in</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
