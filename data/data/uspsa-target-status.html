<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USPSA Target — Status Indicator</title>
<style>
  :root {
    --line-dark: #2b2320;
    --bg: #1b1a17;
    --ink: #f2ede4;

    --color-active: #b8302a;
    --color-active-dark: #7a1f1b;
    --color-inactive: #3f8f4f;
    --color-inactive-dark: #295e32;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .stage {
    width: min(260px, 70vw);
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.5));
    transition: fill 0.2s ease;
  }

  .silhouette {
    stroke: var(--line-dark);
    stroke-width: 2;
    transition: fill 0.2s ease;
  }

  .zone-line {
    fill: none;
    stroke: var(--line-dark);
    stroke-width: 1.4;
    stroke-dasharray: 4 3;
    opacity: 0.55;
  }

  /* State classes — put either of these on the <svg> or a parent wrapper */
  .target.is-active .silhouette   { fill: var(--color-active); }
  .target.is-inactive .silhouette { fill: var(--color-inactive); }

  .status {
    margin-top: 20px;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .status.is-active   { color: var(--color-active); }
  .status.is-inactive { color: var(--color-inactive); }

  button {
    margin-top: 20px;
    background: none;
    border: 1px solid #55503f;
    color: var(--ink);
    padding: 8px 18px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  button:hover { border-color: var(--ink); }
</style>
</head>
<body>

<div class="stage">
  <svg id="target" class="target is-inactive" viewBox="0 0 300 480" xmlns="http://www.w3.org/2000/svg">

    <!-- Outer silhouette: head + shoulders + torso, USPSA-style rounded outline -->
    <path class="silhouette" d="
      M 150 8
      C 118 8 98 30 98 64
      C 98 88 108 104 122 114
      L 122 128
      C 80 138 42 156 28 182
      C 16 204 12 232 12 268
      L 12 452
      C 12 466 22 476 36 476
      L 264 476
      C 278 476 288 466 288 452
      L 288 268
      C 288 232 284 204 272 182
      C 258 156 220 138 178 128
      L 178 114
      C 192 104 202 88 202 64
      C 202 30 182 8 150 8
      Z" />

    <!-- C-zone outline -->
    <path class="zone-line" d="
      M 150 96
      C 118 96 88 112 70 140
      C 52 168 44 202 44 240
      L 44 400
      C 44 424 58 440 82 440
      L 218 440
      C 242 440 256 424 256 400
      L 256 240
      C 256 202 248 168 230 140
      C 212 112 182 96 150 96
      Z" />

    <!-- A-zone outline -->
    <path class="zone-line" d="
      M 150 140
      C 128 140 108 152 96 172
      C 84 192 78 216 78 246
      L 78 372
      C 78 390 90 402 108 402
      L 192 402
      C 210 402 222 390 222 372
      L 222 246
      C 222 216 216 192 204 172
      C 192 152 172 140 150 140
      Z" />
  </svg>
</div>

<div class="status is-inactive" id="statusLabel">Drill inactive</div>
<button id="toggle">Toggle drill state (demo only)</button>

<script>
  // Demo-only toggle so you can preview both states. In your real site,
  // just add/remove "is-active" / "is-inactive" wherever your drill state changes.
  const target = document.getElementById('target');
  const label = document.getElementById('statusLabel');
  let active = false;

  document.getElementById('toggle').addEventListener('click', () => {
    active = !active;
    target.classList.toggle('is-active', active);
    target.classList.toggle('is-inactive', !active);
    label.classList.toggle('is-active', active);
    label.classList.toggle('is-inactive', !active);
    label.textContent = active ? 'Drill active' : 'Drill inactive';
  });
</script>

</body>
</html>
