<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drills</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="p-3 text-white bg-primary text-center border-start border-5 border-secondary rounded-3 m-3" style="--bs-primary-rgb: 0, 87, 184;">
        Drill Library
    </header>

        <!-- Menu Button -->
    <div class="m-3">
        <button class="btn btn-outline-primary d-flex flex-column gap-1 p-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPanel" aria-controls="menuPanel" aria-label="Open menu">
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
        </button>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="menuPanel" aria-labelledby="menuPanelLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuPanelLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close menu"></button>
        </div>
        <div class="offcanvas-body">
            <div class="d-grid gap-2">
                <a class="btn btn-outline-primary text-start" href="index.html">Targets</a>
                <button class="btn btn-outline-primary text-start">Login</button>
                <button class="btn btn-outline-primary text-start">Score</button>
            </div>
        </div>
    </div>

    <main class="container-fluid px-3 px-md-4 py-3">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h3 mb-1">Available Drills</h1>
                <p class="text-secondary mb-0">Select a drill to review its setup.</p>
            </div>
            <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#newDrillModal">
                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>
                New Drill
            </button>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="drillList" aria-live="polite"></div>
    </main>

    <div class="modal fade" id="newDrillModal" tabindex="-1" aria-labelledby="newDrillModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newDrillModalLabel">New Drill</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="newDrillForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="drillName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="drillName" name="drillName" placeholder="Enter drill name" required>
                        </div>
                        <div class="mb-3">
                            <label for="targetNumber" class="form-label">Target number</label>
                            <input type="number" class="form-control" id="targetNumber" name="targetNumber" min="1" placeholder="e.g. 3">
                        </div>
                        <div class="mb-3">
                            <label for="drillDuration" class="form-label">Duration</label>
                            <input type="text" class="form-control" id="drillDuration" name="drillDuration" placeholder="00:30">
                        </div>
                        <div class="mb-3 mb-0">
                            <label for="drillOwner" class="form-label">Owner</label>
                            <input type="text" class="form-control" id="drillOwner" name="drillOwner" placeholder="Enter owner name">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</html>
