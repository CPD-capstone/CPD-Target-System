<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drills</title>
    <!--
        NOTE (offline AP issue): Bootstrap and Bootstrap Icons load from the jsDelivr CDN, but
        phones joined to the "CPD Range Control" access point have no internet, so these fail
        and the page renders unstyled. Fix: download the files into data/ and serve them from
        LittleFS instead, e.g.
          data/vendor/bootstrap.min.css.gz
          data/vendor/bootstrap.bundle.min.js.gz
          data/vendor/bootstrap-icons.min.css.gz
          data/vendor/fonts/bootstrap-icons.woff2   (icons CSS expects ./fonts/ next to it)
        then change these tags to href="vendor/bootstrap.min.css" etc. serveStatic() will
        automatically send the .gz version, keeping flash usage to roughly 250 KB total.
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="p-3 text-white bg-primary text-center border-start border-5 border-secondary rounded-3 m-3" style="--bs-primary-rgb: 0, 87, 184;">
        Drill Library
    </header>

        <!-- Menu Button -->
    <div class="m-3">
        <button class="btn btn-outline-primary d-flex flex-column gap-1 p-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPanel" aria-controls="menuPanel" aria-label="Open menu">
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
            <span style="width: 24px; height: 2px; background-color: currentColor;"></span>
        </button>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="menuPanel" aria-labelledby="menuPanelLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuPanelLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close menu"></button>
        </div>
        <div class="offcanvas-body">
            <div class="d-grid gap-2">
                <a class="btn btn-outline-primary text-start" href="targets.html">Targets</a>
                <button class="btn btn-outline-primary text-start">Performance</button>
            </div>
        </div>
    </div>

    <main class="container-fluid px-3 px-md-4 py-3">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h3 mb-1">Available Drills</h1>
                <p class="text-secondary mb-0">Select a drill to review its setup.</p>
            </div>
            <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#newDrillModal">
                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>
                New Drill
            </button>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="drillList" aria-live="polite"></div>
    </main>

    <div class="modal fade" id="newDrillModal" tabindex="-1" aria-labelledby="newDrillModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newDrillModalLabel">New Drill</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="newDrillForm" novalidate>
                    <div class="modal-body">
                        <div class="form-validation-message" id="newDrillError" role="alert" aria-live="polite" hidden></div>
                        <div class="mb-3">
                            <label for="drillName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="drillName" name="drillName" placeholder="Enter drill name" required>
                        </div>
                        <div class="mb-3">
                            <label for="targetNumber" class="form-label">Target number</label>
                            <input type="number" class="form-control" id="targetNumber" name="targetNumber" min="1" placeholder="e.g. 3" required>
                        </div>
                        <div class="mb-3">
                            <label for="drillDuration" class="form-label">Duration</label>
                            <input type="text" class="form-control" id="drillDuration" name="drillDuration" placeholder="00:30" required>
                        </div>
                        <div class="mb-3 mb-0">
                            <label for="drillOwner" class="form-label">Owner</label>
                            <input type="text" class="form-control" id="drillOwner" name="drillOwner" placeholder="Enter owner name" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editDrillModal" tabindex="-1" aria-labelledby="editDrillModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editDrillModalLabel">Edit Drill</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editDrillForm" novalidate>
                    <div class="modal-body">
                        <div class="form-validation-message" id="editDrillError" role="alert" aria-live="polite" hidden></div>
                        <input type="hidden" id="editDrillId" name="editDrillId">
                        <div class="mb-3">
                            <label for="editDrillName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="editDrillName" name="editDrillName" placeholder="Enter drill name" required>
                        </div>
                        <div class="mb-3">
                            <label for="editTargetNumber" class="form-label">Target number</label>
                            <input type="number" class="form-control" id="editTargetNumber" name="editTargetNumber" min="1" placeholder="e.g. 3" required>
                        </div>
                        <div class="mb-3">
                            <label for="editDrillDuration" class="form-label">Duration</label>
                            <input type="text" class="form-control" id="editDrillDuration" name="editDrillDuration" placeholder="00:30" required>
                        </div>
                        <div class="mb-3 mb-0">
                            <label for="editDrillOwner" class="form-label">Owner</label>
                            <input type="text" class="form-control" id="editDrillOwner" name="editDrillOwner" placeholder="Enter owner name" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Edit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteDrillModal" tabindex="-1" aria-labelledby="deleteDrillModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content delete-confirmation">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" id="deleteDrillModalLabel">
                        <i class="bi bi-exclamation-triangle-fill text-danger me-2" aria-hidden="true"></i>
                        Delete drill?
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Are you sure you want to delete <strong id="deleteDrillName"></strong>? This cannot be undone.</p>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteDrillButton">
                        <i class="bi bi-trash3 me-1" aria-hidden="true"></i>
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</html>
